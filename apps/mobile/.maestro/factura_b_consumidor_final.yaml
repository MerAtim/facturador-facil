# Factura B a consumidor final, contra el arca simulado del build de pruebas.
appId: com.facturadorfacil.app.pruebas
---
- runFlow: comun/abrir.yaml
- runFlow: comun/inicio.yaml
- tapOn: Nueva factura
# Abre con el cursor en el precio y la pantalla desplazada hasta él: se sube a ver el tipo.
# En iOS el tipo y su explicación se leen juntos: 'Factura B, El IVA…'.
- scrollUntilVisible:
    element: 'Factura B.*'
    direction: UP
- waitForAnimationToEnd
- runFlow:
    file: comun/escribir.yaml
    env:
      CAMPO: Descripción
      TEXTO: Mantenimiento
# El campo agrupa los miles mientras se escribe: con tres cifras no hay reagrupamiento a mitad.
- runFlow:
    file: comun/escribir.yaml
    env:
      CAMPO: '0,00'
      TEXTO: '121'
- scrollUntilVisible:
    element: Revisar factura
- waitForAnimationToEnd
- assertVisible: '\$.100,00'
- tapOn: Revisar factura
- assertVisible: Consumidor Final
- scrollUntilVisible:
    element: 'Emitir factura B por \$.121,00'
- waitForAnimationToEnd
- tapOn: 'Emitir factura B por \$.121,00'
- extendedWaitUntil:
    visible: Factura emitida
    timeout: 30000
- assertVisible: 00001-00000001
- assertVisible: CAE
# La lista de comprobantes suma lo facturado en el período.
- scrollUntilVisible:
    element: Volver al inicio
- tapOn: Volver al inicio
- tapOn: Comprobantes
- assertVisible: '.*facturaste \$.121,00 en 1 comprobante\. Neto \$.100,00 · IVA \$.21,00\.'
