version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Igual que minimumReleaseAge: no se proponen versiones con menos de 14 días.
    cooldown:
      default-days: 14
    commit-message:
      prefix: build
      include: scope
    # El SDK de Expo fija versiones compatibles entre sí de estos paquetes. Se actualizan
    # juntos con `expo install --fix` al cambiar de SDK, nunca de a uno.
    ignore:
      - dependency-name: 'expo'
      - dependency-name: 'expo-*'
      - dependency-name: 'react'
      - dependency-name: 'react-native'
      - dependency-name: 'react-native-*'
      - dependency-name: '@types/react'
    groups:
      dependencias:
        patterns: ['*']
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    commit-message:
      prefix: ci
    groups:
      acciones:
        patterns: ['*']
