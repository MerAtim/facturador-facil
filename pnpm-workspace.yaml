packages:
  - apps/*
  - packages/*

# Solo se instalan versiones publicadas hace al menos 14 días.
# Reduce el riesgo de instalar un paquete comprometido antes de que sea detectado.
minimumReleaseAge: 20160

savePrefix: ''
engineStrict: true

# Versiones que espera el SDK 58 de Expo y que algunas dependencias resuelven mal.
overrides:
  '@react-native/metro-config': 0.88.0
  react-native-reanimated: 4.7.1
  react-native-worklets: 0.13.0
  # Las pestañas web de expo-router lo exigen; tiene que ser la misma versión que react.
  react-dom: 19.3.0

# Avisos de seguridad revisados y aceptados. Revisar el 2026-11-23 o cuando se actualice Expo.
auditConfig:
  ignoreGhsas:
    # node-forge en @expo/cli: solo corre en desarrollo, no viaja en la app. Sin parche disponible.
    - GHSA-86w9-cpqp-85rv
    # Más avisos de node-forge en @expo/cli, también solo de desarrollo. El parche, 1.4.1, salió el
    # 2026-10-27: el 2026-11-10 cumple 14 días, se fuerza con un override y se quitan de la lista.
    - GHSA-7wch-p9px-956x
    - GHSA-jc66-7q78-782g
    - GHSA-8hrf-8g6f-7xwp
    - GHSA-hqq3-7jhf-c5jx
    - GHSA-5x38-2vff-x55p
    # uuid en xcode: herramienta de build de iOS, no usa la función afectada.
    - GHSA-w5hq-g745-h8pq
    # zod 3 en @expo/cli: solo corre en desarrollo, no viaja en la app. El parche existe solo en zod 4,
    # incompatible con la versión que usa Expo.
    - GHSA-mrhx-c7xc-m3w5

# React Native compila código nativo con CMake, que en Windows no tolera los enlaces simbólicos
# del modo aislado de pnpm. Con hoisted, node_modules queda plano como en npm.
nodeLinker: hoisted
