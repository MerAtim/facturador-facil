packages:
  - apps/*
  - packages/*

# Solo se instalan versiones publicadas hace al menos 14 días.
# Reduce el riesgo de instalar un paquete comprometido antes de que sea detectado.
minimumReleaseAge: 20160

savePrefix: ''
engineStrict: true

# Versiones que espera el SDK 57 de Expo y que algunas dependencias resuelven mal.
overrides:
  '@react-native/metro-config': 0.86.3
  react-native-worklets: 0.10.1

# La app no apunta a web, react-dom no es necesario.
peerDependencyRules:
  ignoreMissing:
    - react-dom
